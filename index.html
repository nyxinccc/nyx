<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>NYX</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<h1>NYX</h1>

<div id="auth">
  <h2>Login</h2>
  <input id="user" placeholder="Usuario">
  <input id="pass" type="password" placeholder="Contraseña">
  <button onclick="login()">Entrar</button>
</div>

<div id="dashboard" style="display:none;">
  <h2>Dashboard</h2>

  <p>Usuario: <span id="username"></span></p>
  <p>Balance: S/830 <span id="balance">0</span></p>

  <h3>Depositar</h3>
  <p>Wallet: <span id="wallet"></span></p>
  <button onclick="copyWallet()">Copiar</button>
  <button onclick="deposit()">Depositar 500</button>

  <h3>Retirar</h3>
  <select id="bank">
    <option>BCP</option>
    <option>BBVA</option>
    <option>Interbank</option>
    <option>Scotiabank</option>
  </select>
  <button onclick="withdraw()">Retirar 500</button>

</div>

<script src="script.js"></script>
</body>
</html>
